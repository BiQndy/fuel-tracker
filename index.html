<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fuel Route Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://maps.api.2gis.ru/2.0/loader.js?pkg=full&key=b33facdc-f20e-4837-867d-36ed05444897"
        type="text/javascript">
    </script>
</head>
<body>
    <div id="map"></div>

    <div id="panel">
        <h2>Расход топлива</h2>

        <div class="row">
            <span class="label">Точка А:</span>
            <span id="pointA" class="value">—</span>
        </div>
        <div class="row">
            <span class="label">Точка Б:</span>
            <span id="pointB" class="value">—</span>
        </div>
        <div class="row">
            <span class="label">Расстояние:</span>
            <span id="distance" class="value">—</span>
        </div>

        <div class="divider"></div>

        <div class="row">
            <span class="label">Расход авто:</span>
            <input id="fuelConsumption" type="number" value="8" min="1" max="50" step="0.1" />
            <span class="unit">л / 100 км</span>
        </div>
        <div class="row result">
            <span class="label">Потребуется:</span>
            <span id="fuelResult" class="value highlight">—</span>
        </div>

        <button id="resetBtn">Сбросить маршрут</button>

        <div class="hint">
            Кликните на карте:<br />
            1-й клик — точка А<br />
            2-й клик — точка Б
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
